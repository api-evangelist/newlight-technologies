aid: newlight-technologies
name: Newlight Technologies
description: 'Newlight Technologies, Inc. is a Huntington Beach, California biotechnology
  company founded in 2003 and incorporated in Delaware that produces AirCarbon, a PHB
  biomaterial made by naturally-occurring ocean microorganisms that consume air and
  greenhouse gas. The company operates a commercial-scale biomanufacturing plant and
  sells AirCarbon as resin to industrial partners and as finished goods under the Restore
  foodware and Covalent fashion-accessory brands, positioning the material as a carbon-negative,
  home-compostable, ocean-degradable replacement for petroleum plastic. Newlight is a
  materials manufacturer, not a software vendor: it publishes no developer program, no
  API reference and no machine-readable contract. Its only agent-reachable surface is the
  Wix platform Site MCP endpoint that its marketing site advertises in its own llms.txt.'
