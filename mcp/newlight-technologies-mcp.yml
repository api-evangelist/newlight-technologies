x-note: >-
  This is the Wix platform Site MCP endpoint, served from Newlight Technologies' own host
  (www.newlight.com is a Wix-hosted marketing site) and advertised by name in the site's own
  llms.txt under an "AI Agent Access" heading. It exposes public marketing-site content plus the
  generic Wix business-solutions API surface — it is NOT a Newlight product API. Newlight is a
  biomaterials manufacturer; it publishes no developer portal, no API reference and no
  machine-readable contract, and api./developer./developers./docs.newlight.com all return
  NXDOMAIN. The tool set below is the Wix platform's, identical across every Wix site, so it
  describes site content retrieval and Wix commerce actions rather than anything specific to
  AirCarbon. Recorded because the endpoint is genuinely live and returned a real tools/list to an
  anonymous POST, not because it represents a first-party API program.
